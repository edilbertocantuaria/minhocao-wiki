services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: minhocao_wiki
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - ./servers.json:/pgadmin4/servers.json
    depends_on:
      - db
    restart: unless-stopped

  api:
    build:
      context: ./api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://postgres:postgres@db:5432/minhocao_wiki}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    volumes:
      - ./api/config.yaml:/app/config.yaml:ro
      - ./api/docs:/app/docs
      - ./api/logs:/app/logs
    depends_on:
      - db
    restart: unless-stopped

  ingest-worker:
    build:
      context: ./api
    command:
      - /bin/sh
      - -lc
      - |
        while true; do
          interval="$${INGEST_INTERVAL_SECONDS:-7200}";
          start_epoch="$(date +%s)";
          echo "[ingest-worker] starting ingestion at $(date '+%Y-%m-%d %H:%M:%S') (interval=$${interval}s)";

          if python ingestion/ingest_documents.py; then
            echo "[ingest-worker] ingestion finished successfully";
          else
            echo "[ingest-worker] ingestion failed (will retry)";
          fi;

          end_epoch="$(date +%s)";
          duration="$((end_epoch - start_epoch))";
          sleep_for="$((interval - duration))";

          if [ "$${sleep_for}" -lt 0 ]; then
            sleep_for=0;
          fi;

          echo "[ingest-worker] duration=$${duration}s, sleeping=$${sleep_for}s, next cycle at $(date -d "+$${sleep_for} seconds" '+%Y-%m-%d %H:%M:%S')";
          sleep "$${sleep_for}";
        done
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://postgres:postgres@db:5432/minhocao_wiki}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - INGEST_INTERVAL_SECONDS=${INGEST_INTERVAL_SECONDS:-7200}
    volumes:
      - ./api/config.yaml:/app/config.yaml:ro
      - ./api/docs:/app/docs
      - ./api/logs:/app/logs
      - ./api/unb.zip:/app/unb.zip:ro
    depends_on:
      - db
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
